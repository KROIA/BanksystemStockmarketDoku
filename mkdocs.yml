site_name: BankSystem & StockMarket
site_description: Player, admin and developer documentation for the StockMarket and BankSystem Minecraft mods.
site_url: https://kroia.github.io/BanksystemStockmarketDoku/
docs_dir: docs
strict: true
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/home-fx.js
  - assets/javascripts/feedback.js

hooks:
  - hooks/check_front_matter.py

plugins:
  - search
  - glightbox:
      zoomable: true
      skip_classes:
        - no-zoom
  # German pages are page.de.md next to page.md (rules: planning/translation/README.md);
  # a page without one shows the English text. Nav section names are translated below.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: de
          name: Deutsch
          build: true
          site_description: Spieler-, Admin- und Entwicklerdokumentation für die Minecraft-Mods StockMarket und BankSystem.
          theme:
            palette:
              - media: "(prefers-color-scheme: light)"
                scheme: default
                primary: custom
                accent: custom
                toggle:
                  icon: material/weather-night
                  name: Zum dunklen Modus wechseln
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                primary: custom
                accent: custom
                toggle:
                  icon: material/weather-sunny
                  name: Zum hellen Modus wechseln
          admonition_translations:
            note: Hinweis
            tip: Tipp
            warning: Warnung
            danger: Gefahr
          nav_translations:
            Home: Startseite
            Player Guide: Spielerhandbuch
            Start here: Einstieg
            Companies: Unternehmen
            Server Admin: Server-Admin
            Setup: Einrichtung
            Integrations: Integrationen
            Audit and anti-cheat: Audit und Anti-Cheat
            Developers: Entwickler
            Custom plugins: Eigene Plugins

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

