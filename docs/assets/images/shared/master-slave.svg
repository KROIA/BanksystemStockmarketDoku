<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="One master server with the data and two slave servers connected to it">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#455a64"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- master -->
    <rect x="230" y="20" width="300" height="140" rx="10" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
    <text x="380" y="52" font-size="18" font-weight="bold" fill="#004d40">Master server</text>
    <text x="380" y="80" font-size="13" fill="#00695c">stores all bank accounts, markets and orders</text>
    <text x="380" y="100" font-size="13" fill="#00695c">runs the bots and the news</text>
    <text x="380" y="120" font-size="13" fill="#00695c">writes the ledger and audit files</text>
    <text x="380" y="144" font-size="12" fill="#546e7a">players can play here too</text>

    <!-- slaves -->
    <rect x="30" y="250" width="300" height="120" rx="10" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
    <text x="180" y="282" font-size="17" font-weight="bold" fill="#263238">Slave "survival"</text>
    <text x="180" y="308" font-size="13" fill="#2e7d32">trusted: players bank and trade</text>
    <text x="180" y="330" font-size="13" fill="#455a64">asks the master for every request</text>
    <text x="180" y="352" font-size="12" fill="#546e7a">villagers, placeholders: master's data</text>

    <rect x="430" y="250" width="300" height="120" rx="10" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
    <text x="580" y="282" font-size="17" font-weight="bold" fill="#263238">Slave "creative"</text>
    <text x="580" y="308" font-size="13" fill="#c62828">not trusted: players can only look</text>
    <text x="580" y="330" font-size="13" fill="#455a64">asks the master for every request</text>
    <text x="580" y="352" font-size="12" fill="#546e7a">run /banksystem trust on the master</text>

    <!-- links -->
    <line x1="180" y1="245" x2="300" y2="166" stroke="#455a64" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="580" y1="245" x2="460" y2="166" stroke="#455a64" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="380" y="206" font-size="13" fill="#263238">TCP port 25575</text>
    <text x="380" y="224" font-size="12" fill="#546e7a">same shared secret on every server</text>
  </g>
</svg>
