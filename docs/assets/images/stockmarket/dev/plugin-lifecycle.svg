<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" role="img" aria-label="The calls a StockMarket plugin gets when it is created or loaded, every tick, and at other times">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#455a64"/>
    </marker>
  </defs>
  <rect width="780" height="470" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="390" y="28" font-size="16" font-weight="bold" fill="#1f2937">The life of a plugin instance</text>

    <!-- column headers -->
    <text x="130" y="60" font-size="14" font-weight="bold" fill="#263238">Created or loaded</text>
    <text x="380" y="60" font-size="14" font-weight="bold" fill="#004d40">Every tick, while enabled</text>
    <text x="650" y="60" font-size="14" font-weight="bold" fill="#6d4c00">Any time</text>

    <!-- column 1: creation and world load -->
    <g fill="#eceff1" stroke="#607d8b" stroke-width="2">
      <rect x="20" y="76" width="220" height="44" rx="8"/>
      <rect x="20" y="132" width="220" height="44" rx="8"/>
    </g>
    <g fill="#eceff1" stroke="#607d8b" stroke-width="2" stroke-dasharray="6 4">
      <rect x="20" y="188" width="220" height="44" rx="8"/>
      <rect x="20" y="244" width="220" height="44" rx="8"/>
      <rect x="20" y="300" width="220" height="44" rx="8"/>
      <rect x="20" y="356" width="220" height="44" rx="8"/>
    </g>
    <g font-size="13" font-weight="bold" fill="#263238">
      <text x="130" y="95">Add Plugin, or world load</text>
      <text x="130" y="151" font-family="Consolas, Menlo, monospace">init()</text>
      <text x="130" y="207" font-family="Consolas, Menlo, monospace">onMarketSubscribed</text>
      <text x="130" y="263" font-family="Consolas, Menlo, monospace">onCustomSettingsApplied</text>
      <text x="130" y="319" font-family="Consolas, Menlo, monospace">load(tag)</text>
      <text x="130" y="375" font-family="Consolas, Menlo, monospace">onEnable()</text>
    </g>
    <g font-size="12" fill="#546e7a">
      <text x="130" y="112">the registry creates the instance</text>
      <text x="130" y="168">no markets yet</text>
      <text x="130" y="224">saved markets, default settings</text>
      <text x="130" y="280">saved settings replace the defaults</text>
      <text x="130" y="336">your own saved data</text>
      <text x="130" y="392">if it was saved enabled</text>
    </g>
    <g stroke="#455a64" stroke-width="2" marker-end="url(#a)">
      <line x1="130" y1="120" x2="130" y2="130"/>
      <line x1="130" y1="176" x2="130" y2="186"/>
      <line x1="130" y1="232" x2="130" y2="242"/>
      <line x1="130" y1="288" x2="130" y2="298"/>
      <line x1="130" y1="344" x2="130" y2="354"/>
    </g>
    <text x="130" y="424" font-size="12" fill="#546e7a">dashed: world load only</text>
    <text x="130" y="442" font-size="12" fill="#546e7a">Add Plugin starts disabled, with no markets</text>

    <!-- arrow into the tick loop -->
    <path d="M240 378 H257 V136 H271" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/>

    <!-- column 2: the tick -->
    <g fill="#e0f2f1" stroke="#00796b" stroke-width="2">
      <rect x="275" y="110" width="210" height="56" rx="8"/>
      <rect x="275" y="200" width="210" height="56" rx="8"/>
      <rect x="275" y="290" width="210" height="56" rx="8"/>
    </g>
    <g font-size="13" font-weight="bold" fill="#004d40" font-family="Consolas, Menlo, monospace">
      <text x="380" y="133">update(markets)</text>
      <text x="380" y="223">finalize(markets)</text>
    </g>
    <text x="380" y="313" font-size="13" font-weight="bold" fill="#004d40">Changes applied</text>
    <g font-size="12" fill="#00695c">
      <text x="380" y="152">every plugin, top to bottom</text>
      <text x="380" y="242">every plugin, same order</text>
      <text x="380" y="332">target prices, orders, order book</text>
    </g>
    <g stroke="#455a64" stroke-width="2" marker-end="url(#a)">
      <line x1="380" y1="166" x2="380" y2="198"/>
      <line x1="380" y1="256" x2="380" y2="288"/>
    </g>
    <path d="M485 318 H505 V138 H489" fill="none" stroke="#455a64" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
    <text x="0" y="0" font-size="12" fill="#546e7a" transform="translate(519 228) rotate(-90)">next tick</text>
    <text x="380" y="376" font-size="12" fill="#546e7a">markets outside their trading hours are left out</text>

    <!-- column 3: events -->
    <g fill="#fff8e1" stroke="#ff8f00" stroke-width="2">
      <rect x="540" y="76" width="220" height="44" rx="8"/>
      <rect x="540" y="132" width="220" height="44" rx="8"/>
      <rect x="540" y="188" width="220" height="44" rx="8"/>
      <rect x="540" y="244" width="220" height="44" rx="8"/>
      <rect x="540" y="300" width="220" height="44" rx="8"/>
    </g>
    <rect x="540" y="356" width="220" height="44" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
    <g font-size="13" font-weight="bold" fill="#6d4c00">
      <text x="650" y="95">A market is added</text>
      <text x="650" y="151">Apply in the settings form</text>
      <text x="650" y="207">The Enabled switch</text>
      <text x="650" y="263">The world is saved</text>
      <text x="650" y="319">A market is removed</text>
      <text x="650" y="375" fill="#b71c1c">An admin deletes the plugin</text>
    </g>
    <g font-size="12" fill="#8d6e00" font-family="Consolas, Menlo, monospace">
      <text x="650" y="112">onMarketSubscribed</text>
      <text x="650" y="168">onCustomSettingsApplied</text>
      <text x="650" y="224">onEnable() / onDisable()</text>
      <text x="650" y="280">save(tag)</text>
      <text x="650" y="336">onMarketUnsubscribed</text>
      <text x="650" y="392" fill="#b71c1c">deInit()</text>
    </g>
    <text x="650" y="424" font-size="12" fill="#546e7a">deInit() doesn't run when</text>
    <text x="650" y="442" font-size="12" fill="#546e7a">the server stops</text>
  </g>
</svg>
