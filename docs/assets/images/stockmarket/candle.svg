<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410" role="img" aria-label="A rising and a falling candle with open, close, high and low marked">
  <rect width="720" height="410" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="360" y="32" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">One candle shows four prices of its time span</text>

    <!-- rising candle -->
    <line x1="220" y1="70" x2="220" y2="340" stroke="#26a69a" stroke-width="3"/>
    <rect x="185" y="130" width="70" height="140" fill="#26a69a"/>
    <text x="220" y="206" font-size="13" fill="#ffffff" text-anchor="middle">body</text>
    <text x="230" y="104" font-size="13" fill="#6b7280">wick</text>
    <g stroke="#9ca3af" stroke-dasharray="4 3">
      <line x1="140" y1="70" x2="216" y2="70"/>
      <line x1="140" y1="130" x2="183" y2="130"/>
      <line x1="140" y1="270" x2="183" y2="270"/>
      <line x1="140" y1="340" x2="216" y2="340"/>
    </g>
    <g font-size="14" fill="#1f2937" text-anchor="end">
      <text x="134" y="75"><tspan font-weight="bold">High</tspan></text>
      <text x="134" y="135"><tspan font-weight="bold">Close</tspan></text>
      <text x="134" y="275"><tspan font-weight="bold">Open</tspan></text>
      <text x="134" y="345"><tspan font-weight="bold">Low</tspan></text>
    </g>
    <text x="220" y="378" font-size="14" font-weight="bold" fill="#1b7f74" text-anchor="middle">Green: the price went up</text>
    <text x="220" y="398" font-size="13" fill="#6b7280" text-anchor="middle">closed higher than it opened</text>

    <!-- falling candle -->
    <line x1="500" y1="70" x2="500" y2="340" stroke="#ef5350" stroke-width="3"/>
    <rect x="465" y="130" width="70" height="140" fill="#ef5350"/>
    <g stroke="#9ca3af" stroke-dasharray="4 3">
      <line x1="504" y1="70" x2="580" y2="70"/>
      <line x1="537" y1="130" x2="580" y2="130"/>
      <line x1="537" y1="270" x2="580" y2="270"/>
      <line x1="504" y1="340" x2="580" y2="340"/>
    </g>
    <g font-size="14" fill="#1f2937">
      <text x="586" y="75"><tspan font-weight="bold">High</tspan></text>
      <text x="586" y="135"><tspan font-weight="bold">Open</tspan></text>
      <text x="586" y="275"><tspan font-weight="bold">Close</tspan></text>
      <text x="586" y="345"><tspan font-weight="bold">Low</tspan></text>
    </g>
    <text x="500" y="378" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">Red: the price went down</text>
    <text x="500" y="398" font-size="13" fill="#6b7280" text-anchor="middle">closed lower than it opened</text>
  </g>
</svg>
